spring.application.name=Course_Management_Application
server.port=8080
#MySql Connection dataBase
spring.datasource.url=jdbc:mysql://localhost:3306/course_management_application?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA and Hibernate Configuration (Optional but commonly used)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
